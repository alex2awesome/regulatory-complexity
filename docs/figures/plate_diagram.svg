<ellipse class="lat" cx="250" cy="482" rx="54" ry="22"/><text class="nm" x="250" y="480">τ<tspan font-size="9" dy="3">i</tspan></text><text class="sub" x="250" y="495">act type</text>
<ellipse class="lat" cx="372" cy="482" rx="54" ry="22"/><text class="nm" x="372" y="480">b<tspan font-size="9" dy="3">i</tspan></text><text class="sub" x="372" y="495">who waits</text>
<ellipse class="lat" cx="480" cy="482" rx="42" ry="22"/><text class="nm" x="480" y="480">v<tspan font-size="9" dy="3">i</tspan></text><text class="sub" x="480" y="495">visibility</text>
<ellipse class="lat" cx="122" cy="556" rx="58" ry="22"/><text class="nm" x="122" y="554">Q<tspan font-size="9" dy="3">i</tspan></text><text class="sub" x="122" y="569">queue</text>
<ellipse class="lat" cx="250" cy="556" rx="54" ry="22"/><text class="nm" x="250" y="554">W<tspan font-size="9" dy="3">i</tspan></text><text class="sub" x="250" y="569">touch</text>
<ellipse class="lat" cx="404" cy="556" rx="58" ry="22"/><text class="nm" x="404" y="554">f<tspan font-size="9" dy="3">i</tspan></text><text class="sub" x="404" y="569">fee</text>
<ellipse class="lat" cx="196" cy="632" rx="84" ry="25"/><text class="nm" x="196" y="630">μ<tspan font-size="9" dy="3">i,t</tspan>, σ<tspan font-size="9" dy="3">i</tspan></text><text class="sub" x="196" y="646">log-duration, drifting</text>
<ellipse class="lat" cx="404" cy="632" rx="70" ry="25"/><text class="nm" x="404" y="630">i ≺ i'</text><text class="sub" x="404" y="646">order relation</text>

<!-- CASE plate with nested step sub-plate -->
<rect class="pl" x="552" y="440" width="278" height="268" rx="3"/>
<text class="plab" x="814" y="698" text-anchor="end">cases  n = 1…N<tspan font-size="9">js</tspan></text>
<ellipse class="lat" cx="632" cy="482" rx="58" ry="22"/><text class="nm" x="632" y="480">path<tspan font-size="9" dy="3">n</tspan></text><text class="sub" x="632" y="495">branch</text>
<ellipse class="lat" cx="756" cy="482" rx="54" ry="22"/><text class="nm" x="756" y="480">R<tspan font-size="9" dy="3">n</tspan></text><text class="sub" x="756" y="495">rework</text>
<rect class="pl" x="570" y="512" width="242" height="80" rx="3"/>
<text class="plab" x="800" y="583" text-anchor="end">× steps i</text>
<ellipse class="lat" cx="668" cy="544" rx="66" ry="22"/><text class="nm" x="668" y="542">T<tspan font-size="9" dy="3">n,i</tspan></text><text class="sub" x="668" y="557">realised days</text>
<ellipse class="lat" cx="632" cy="624" rx="58" ry="22"/><text class="nm" x="632" y="622">Y<tspan font-size="9" dy="3">n</tspan></text><text class="sub" x="632" y="637">outcome</text>
<ellipse class="lat" cx="756" cy="624" rx="58" ry="22"/><text class="nm" x="756" y="622">S<tspan font-size="9" dy="3">n</tspan></text><text class="sub" x="756" y="637">posts?</text>

<!-- DOCUMENT plate -->
<rect class="pl" x="852" y="440" width="264" height="268" rx="3"/>
<text class="plab" x="1100" y="698" text-anchor="end">documents  m = 1…M</text>
<ellipse class="lat" cx="922" cy="482" rx="52" ry="22"/><text class="nm" x="922" y="480">k<tspan font-size="9" dy="3">m</tspan></text><text class="sub" x="922" y="495">kind</text>
<ellipse class="lat" cx="1040" cy="482" rx="52" ry="22"/><text class="nm" x="1040" y="480">t<tspan font-size="9" dy="3">m</tspan></text><text class="sub" x="1040" y="495">date</text>
<ellipse class="obs" cx="984" cy="552" rx="74" ry="23"/><text class="nm" x="984" y="550">claim<tspan font-size="9" dy="3">m</tspan></text><text class="sub" x="984" y="566">what it states</text>
<ellipse class="obs" cx="984" cy="616" rx="74" ry="23"/><text class="nm" x="984" y="614">y<tspan font-size="9" dy="3">m</tspan></text><text class="sub" x="984" y="630">reported duration</text>
<ellipse class="obs" cx="984" cy="676" rx="74" ry="23"/><text class="nm" x="984" y="674">pkg<tspan font-size="9" dy="3">m</tspan></text><text class="sub" x="984" y="690">extracted package</text>

