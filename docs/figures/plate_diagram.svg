<text class="nb" x="24" y="1024">Corrected from v1:</text>
<text class="note" x="24" y="1044">steps, cases and documents now sit inside an explicit program plate (j,s), because a step depends on the statute AND the jurisdiction — v1 nested them under the jurisdiction alone;</text>
<text class="note" x="24" y="1064">realised duration T is in a step sub-plate inside the case plate, since it is indexed by both — v1 put it in the case plate alone; disclosure propensity π and extractor error ε are</text>
<text class="note" x="24" y="1084">now globals outside every plate, because they are shared across documents and indexed by kind, not by document — v1 drew them per-document, which asserts a separate</text>
<text class="note" x="24" y="1104">propensity for each one. The duration state carries a time index μ(i,t) to match the drift model. Three nodes were missing and are added: Z, which steps exist (a partition, so</text>
<text class="note" x="24" y="1124">the step count is inferred, not assumed); Φ, the act-to-agency affinity that the entropy test showed carries 0.6 bits on average; and y, the reported duration — the observable</text>
<text class="note" x="24" y="1144">is a reported or summarised figure, never T itself. The fee is parented by the jurisdiction's fee instrument F(j), since within a jurisdiction a fee is administered, not drawn — and it now points onward to</text>
<text class="note" x="24" y="1170">the claims a document makes, because a fee nothing observes is unidentifiable. Actor and log-duration likewise feed the claims and the reported duration directly: an agency's published median describes the distribution, not one case. Statute-level documents (the statute text, a committee analysis) formally sit in a document plate at statute level; they are drawn here for compactness.</text>
</svg>
