<svg viewBox="0 0 1160 1180" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pt pd" font-family="Archivo, Helvetica, Arial, sans-serif">
<title id="pt">Plate diagram, v2: how an administrative process comes to be and how evidence about it is generated</title>
<desc id="pd">Global parameters at the top feed a statute plate and a jurisdiction plate. Their intersection is a program plate, which contains the step, case and document plates. Shaded nodes are observed. Corrected from v1: steps now sit inside both statute and jurisdiction context; realised durations sit in a step sub-plate inside the case plate; disclosure propensity and extractor error are globals outside every plate; the duration state carries a time index; step existence and the act-to-agency affinity are explicit nodes.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#727A80"/>
  </marker>
  <style>
    .pl{fill:none;stroke:var(--rule,#CFD4CC);stroke-width:1.4}
    .pl2{fill:none;stroke:var(--ink-3,#727A80);stroke-width:1.4;stroke-dasharray:6 4}
    .plab{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;fill:var(--ink-3,#727A80)}
    .glab{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;fill:var(--hidden,#4C4A7D)}
    .lat{fill:var(--panel,#fff);stroke:var(--ink,#14181D);stroke-width:1.5}
    .obs{fill:var(--facing-bg,#DFF0ED);stroke:var(--facing,#0F766E);stroke-width:1.8}
    .hyp{fill:var(--hidden-bg,#E5E4F0);stroke:var(--hidden,#4C4A7D);stroke-width:1.5}
    .nm{font-size:12.5px;fill:var(--ink,#14181D);text-anchor:middle}
    .sub{font-size:10px;fill:var(--ink-3,#727A80);text-anchor:middle}
    .e{stroke:#727A80;stroke-width:1.25;fill:none;marker-end:url(#a)}
    .ec{stroke:var(--stamp,#A3342A);stroke-width:1.35;fill:none;marker-end:url(#a);stroke-dasharray:5 4}
    .note{font-size:11.5px;fill:var(--ink-2,#4A5158)}
    .nb{font-size:11.5px;fill:var(--ink-2,#4A5158);font-weight:600}
  </style>
</defs>

<!-- ============ GLOBALS: shared parameters, outside every plate ============ -->
<text class="glab" x="24" y="22">global parameters — shared across all statutes, jurisdictions and documents</text>
<ellipse class="hyp" cx="96" cy="58" rx="70" ry="25"/><text class="nm" x="96" y="55">α<tspan font-size="9" dy="3">τ</tspan></text><text class="sub" x="96" y="71">act-type touch time</text>
<ellipse class="hyp" cx="250" cy="58" rx="70" ry="25"/><text class="nm" x="250" y="55">Φ</text><text class="sub" x="250" y="71">act→agency affinity</text>
<ellipse class="hyp" cx="404" cy="58" rx="70" ry="25"/><text class="nm" x="404" y="55">μ<tspan font-size="9" dy="3">fam</tspan>, τ²</text><text class="sub" x="404" y="71">step-key family</text>
<ellipse class="hyp" cx="558" cy="58" rx="66" ry="25"/><text class="nm" x="558" y="55">τ²<tspan font-size="9" dy="3">walk</tspan></text><text class="sub" x="558" y="71">drift rate</text>
<ellipse class="hyp" cx="716" cy="58" rx="80" ry="25"/><text class="nm" x="716" y="55">π(k, v, F)</text><text class="sub" x="716" y="71">disclosure propensity</text>
<ellipse class="hyp" cx="886" cy="58" rx="66" ry="25"/><text class="nm" x="886" y="55">ε<tspan font-size="9" dy="3">k</tspan></text><text class="sub" x="886" y="71">extractor error</text>
<ellipse class="hyp" cx="1030" cy="58" rx="66" ry="25"/><text class="nm" x="1030" y="55">α<tspan font-size="9" dy="3">CRP</tspan></text><text class="sub" x="1030" y="71">new-step rate</text>

<!-- ============ STATUTE plate ============ -->
<rect class="pl" x="24" y="104" width="420" height="120" rx="3"/>
<text class="plab" x="420" y="215" text-anchor="end">statutes  s = 1…S</text>
<ellipse class="obs" cx="106" cy="142" rx="60" ry="22"/><text class="nm" x="106" y="140">E<tspan font-size="9" dy="3">s</tspan></text><text class="sub" x="106" y="155">skeleton</text>
<ellipse class="obs" cx="242" cy="142" rx="60" ry="22"/><text class="nm" x="242" y="140">c<tspan font-size="9" dy="3">e</tspan></text><text class="sub" x="242" y="155">shot clocks</text>
<ellipse class="obs" cx="370" cy="142" rx="56" ry="22"/><text class="nm" x="370" y="140">prec<tspan font-size="9" dy="3">s</tspan></text><text class="sub" x="370" y="155">precedence</text>
<ellipse class="obs" cx="106" cy="192" rx="60" ry="22"/><text class="nm" x="106" y="190">O<tspan font-size="9" dy="3">s</tspan></text><text class="sub" x="106" y="205">open choices</text>

<!-- ============ JURISDICTION plate ============ -->
<rect class="pl" x="476" y="104" width="656" height="240" rx="3"/>
<text class="plab" x="1108" y="335" text-anchor="end">jurisdictions  j = 1…J</text>
<ellipse class="obs" cx="556" cy="142" rx="62" ry="22"/><text class="nm" x="556" y="140">A<tspan font-size="9" dy="3">j</tspan></text><text class="sub" x="556" y="155">dept roster</text>
<ellipse class="lat" cx="694" cy="142" rx="58" ry="22"/><text class="nm" x="694" y="140">L<tspan font-size="9" dy="3">j</tspan></text><text class="sub" x="694" y="155">lineage</text>
<ellipse class="lat" cx="826" cy="142" rx="58" ry="22"/><text class="nm" x="826" y="140">F<tspan font-size="9" dy="3">j</tspan></text><text class="sub" x="826" y="155">fee instrument</text>
<!-- DEPARTMENT plate -->
<rect class="pl" x="496" y="176" width="418" height="150" rx="3"/>
<text class="plab" x="898" y="316" text-anchor="end">departments  d = 1…D<tspan font-size="9">j</tspan></text>
<ellipse class="lat" cx="568" cy="216" rx="54" ry="21"/><text class="nm" x="568" y="214">δ<tspan font-size="9" dy="3">d</tspan></text><text class="sub" x="568" y="229">speed</text>
<ellipse class="lat" cx="688" cy="216" rx="54" ry="21"/><text class="nm" x="688" y="214">ρ<tspan font-size="9" dy="3">d</tspan></text><text class="sub" x="688" y="229">utilisation</text>
<ellipse class="lat" cx="808" cy="216" rx="54" ry="21"/><text class="nm" x="808" y="214">κ<tspan font-size="9" dy="3">d</tspan></text><text class="sub" x="808" y="229">cadence</text>
<ellipse class="lat" cx="628" cy="278" rx="54" ry="21"/><text class="nm" x="628" y="276">ψ<tspan font-size="9" dy="3">d</tspan></text><text class="sub" x="628" y="291">clock compliance</text>
