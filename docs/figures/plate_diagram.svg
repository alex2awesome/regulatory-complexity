<!-- ============ PROGRAM plate: the (j,s) intersection ============ -->
<rect class="pl2" x="24" y="368" width="1108" height="586" rx="3"/>
<text class="plab" x="1108" y="945" text-anchor="end">programs  (j, s) — one statute as one jurisdiction runs it</text>
<ellipse class="lat" cx="118" cy="406" rx="70" ry="23"/><text class="nm" x="118" y="404">R<tspan font-size="9" dy="3">js</tspan></text><text class="sub" x="118" y="419">local rule</text>
<ellipse class="lat" cx="286" cy="406" rx="76" ry="23"/><text class="nm" x="286" y="404">Z<tspan font-size="9" dy="3">js</tspan></text><text class="sub" x="286" y="419">which steps exist</text>
<text class="note" x="378" y="410">a partition, not a fixed list: the step count is itself inferred</text>

