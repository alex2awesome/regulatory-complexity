<g transform="translate(24,974)">
  <ellipse class="lat" cx="18" cy="13" rx="16" ry="10"/><text class="note" x="40" y="17">latent</text>
  <ellipse class="obs" cx="108" cy="13" rx="16" ry="10"/><text class="note" x="130" y="17">observed</text>
  <ellipse class="hyp" cx="218" cy="13" rx="16" ry="10"/><text class="note" x="240" y="17">global parameter</text>
  <path class="ec" d="M376 13 L414 13"/><text class="note" x="422" y="17">policy or selection edge, not a plain draw</text>
